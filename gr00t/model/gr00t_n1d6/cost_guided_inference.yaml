mode: fkc
time_grid:
  num_steps: 4

flow_source:
  mean: 0.0
  variance: 1.0

score:
  eps: 1.0e-6

sigma_schedule:
  kind: zero_ends
  alpha: 0.25

beta_schedule:
  kind: constant
  #guidance_strength: 500000.0
  guidance_strength: 5e3

linear_combo: {}

fkc:
  num_particles: 8
  resample_interval: 1
  resample_t_min: 0.05
  resample_t_max: 0.95
  center_log_weight_increment: true

objective:
  # Selects the inequality penalty for fkc / linear_combo modes.
  # Options: cylinder_ellipse | cylinder_squared_hinge | cylinder_abs | l_obstacle_box
  constraint_task: cylinder_ellipse
  weights:
    cost: 0.0
    equality: 0.0
    #inequality: 1000000000.0
    inequality: 1e3
  placeholder_terms:
    position_smoothness_weight: 1.0
    rotation_smoothness_weight: 0.1
    gripper_smoothness_weight: 0.05
    terminal_position_weight: 1.0
    target_position: [0.0, 0.0, 0.0]
    softplus_beta: 10.0

embodiments:
  0:
    name: oxe_google
    control_kind: eef
    objective_space: normalized
    action_layout:
      position_idx: [0, 1, 2]
      rotation_idx: [3, 4, 5]
      gripper_idx: [6]
    state_layout:
      position_idx: [0, 1, 2]
      rotation_idx: [3, 4, 5, 6]
      gripper_idx: [7]
    decoder:
      action:
        position:
          kind: identity
        rotation:
          kind: identity
        gripper:
          kind: identity
      state:
        position:
          kind: identity
        rotation:
          kind: identity
        gripper:
          kind: identity

  1:
    name: oxe_widowx
    control_kind: eef
    objective_space: normalized
    action_layout:
      position_idx: [0, 1, 2]
      rotation_idx: [3, 4, 5]
      gripper_idx: [6]
    state_layout:
      position_idx: [0, 1, 2]
      rotation_idx: [3, 4, 5]
      gripper_idx: [7]
    decoder:
      action:
        position:
          kind: identity
        rotation:
          kind: identity
        gripper:
          kind: identity
      state:
        position:
          kind: identity
        rotation:
          kind: identity
        gripper:
          kind: identity

  2:
    name: libero_panda
    control_kind: eef
    objective_space: normalized
    action_layout:
      position_idx: [0, 1, 2]
      rotation_idx: [3, 4, 5]
      gripper_idx: [6]
    state_layout:
      position_idx: [0, 1, 2]
      rotation_idx: [3, 4, 5]
      gripper_idx: [6]
    constraint_trajectory:
      kind: libero_osc_delta_rollout
      source: runtime_true_eef_position
      # Number of leading action-horizon steps that are actually executed on
      # the real robot before the policy re-plans. Anything past this index
      # is thrown away by the rollout wrapper, so including it in the proxy
      # would model a trajectory the robot never travels.
      executed_steps: 8
      controller:
        position:
          input_min: [-1.0, -1.0, -1.0]
          input_max: [1.0, 1.0, 1.0]
          output_min: [-0.05, -0.05, -0.05]
          output_max: [0.05, 0.05, 0.05]
          # Per-axis first-order tracking gain calibrated against offline
          # robosuite OSC_POSE rollouts (kp=150, critically damped, 50 ms
          # env step). OSC resets its goal from the current EE pose every
          # env step, so p_{k+1} = p_k + g * delta_k is the exact first
          # order recurrence — a single gain per axis is structurally
          # correct, not an empirical fudge.
          tracking_gain: [0.166, 0.257, 0.233]
        rotation:
          input_min: [-1.0, -1.0, -1.0]
          input_max: [1.0, 1.0, 1.0]
          output_min: [-0.5, -0.5, -0.5]
          output_max: [0.5, 0.5, 0.5]

  8:
    name: unitree_g1
    control_kind: non_eef

  10:
    name: new_embodiment
    control_kind: non_eef

  13:
    name: robocasa_panda_omron
    control_kind: non_eef

  16:
    name: oxe_droid
    control_kind: non_eef

  20:
    name: gr1
    control_kind: non_eef

  24:
    name: behavior_r1_pro
    control_kind: non_eef